<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Griddle Web - 真实题库网页版</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="page-sun" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand-block" id="modeToggle" type="button" aria-label="切换原版与动物版">
      <span class="brand-mark" aria-hidden="true">
        <svg class="brand-svg brand-svg-original" viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4">
          <rect x="4" y="4" width="10" height="10" rx="2"/>
          <rect x="18" y="4" width="10" height="10" rx="2"/>
          <rect x="4" y="18" width="10" height="10" rx="2"/>
          <path d="M18 23h7M23 18v7"/>
        </svg>
        <svg class="brand-svg brand-svg-animal" viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9.5" cy="12" r="2.5"/>
          <circle cx="22.5" cy="12" r="2.5"/>
          <circle cx="16" cy="7.5" r="2.5"/>
          <path d="M7 18c2.4-1.5 5.7-1.5 9 0s6.6 1.5 9 0"/>
          <path d="M7 18c-.3 2.2 1.5 4.4 4.2 4.8 2.7.4 5-1.5 4.8-2.8s2.3 3.2 5 2.8c2.7-.4 4.5-2.6 4.2-4.8"/>
        </svg>
      </span>
      <span class="brand-copy">
        <span class="brand-title" id="brandTitle">Griddle Web</span>
        <span class="brand-subtitle" id="brandSubtitle">249 个真实关卡 · 代码证据恢复</span>
      </span>
    </button>
    <div class="top-actions">
      <button class="lang-toggle" id="langToggle" type="button" hidden aria-pressed="false">中 / EN</button>
      <div class="progress-chip" title="已完成关卡">
        <span class="progress-count" id="progressCount">0 / 249</span>
        <span class="progress-track"><span class="progress-fill" id="progressFill"></span></span>
      </div>
      <button class="ghost-button" id="openLevelsButton" type="button" aria-haspopup="dialog" aria-label="选关">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
        <span id="openLevelsLabel">选关</span>
      </button>
    </div>
  </header>

  <main class="game-shell">
    <section class="board-card" aria-label="谜题棋盘">
      <div class="level-heading">
        <div>
          <p class="eyebrow" id="levelEyebrow">关卡 1 / 214</p>
          <h1 id="levelTitle">Breakfast for Two</h1>
        </div>
        <div class="level-tools">
          <button class="icon-button" id="hintButton" type="button" aria-label="使用提示" data-i18n-aria="hintLabel">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1.5-1 2.5H9c0-1-.3-1.9-1-2.5A6 6 0 0 1 12 3Z"/>
            </svg>
          </button>
          <button class="icon-button" id="eraserButton" type="button" aria-label="使用橡皮擦" aria-pressed="false" data-i18n-aria="eraserLabel">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m7 21-4-4 9-9 7 7-5 6H7Z"/>
              <path d="m12 8 6-6 4 4-6 6"/>
            </svg>
          </button>
          <button class="icon-button" id="restartButton" type="button" aria-label="重开本关" data-i18n-aria="restartLabel">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="board" class="board" aria-live="polite"></div>
      <div class="board-foot">
        <button class="text-button" id="prevButton" type="button">上一关</button>
        <span class="slot-stat" id="slotStat">0 / 0</span>
        <button class="text-button" id="nextButton" type="button">下一关</button>
      </div>
    </section>

    <aside class="clues-card" aria-label="线索面板">
      <div class="clues-heading">
        <div>
          <p class="eyebrow" id="cluesEyebrow">Clue Book</p>
          <h2 id="cluesTitle">线索</h2>
        </div>
        <div class="clues-actions">
          <button class="icon-button clue-reveal-button" id="extraClueButton" type="button" aria-label="揭示下一条线索" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <span class="clue-count" id="clueCount">0 / 0</span>
        </div>
      </div>
      <div id="clues" class="clue-list"></div>
      <div class="legend">
        <span><i class="legend-swatch curtain"></i><span data-i18n="curtainLegend">数字帘</span></span>
        <span><i class="legend-swatch key"></i><span data-i18n="keyLegend">钥匙</span></span>
        <span><i class="legend-swatch lock"></i><span data-i18n="lockLegend">锁</span></span>
      </div>
    </aside>
  </main>

  <div id="selectionPanel" class="selection-panel" hidden>
    <div class="panel-backdrop" data-close-panel></div>
    <section class="panel-card" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-head">
        <div>
          <p class="eyebrow" id="panelEyebrow">选择物品</p>
          <h2 id="panelTitle">这个位置放什么？</h2>
        </div>
        <button class="icon-button" id="panelCloseButton" type="button" aria-label="关闭选择面板" data-i18n-aria="closePanelLabel">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
      <div id="panelOptions" class="panel-options"></div>
    </section>
  </div>

  <dialog id="levelDialog" class="level-dialog" aria-labelledby="dialogTitle">
    <div class="dialog-head">
      <div>
        <p class="eyebrow" id="dialogEyebrow">Level Library</p>
        <h2 id="dialogTitle">选择关卡</h2>
      </div>
      <button class="icon-button" id="dialogCloseButton" type="button" aria-label="关闭选关窗口" data-i18n-aria="closeDialogLabel">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <label class="search-field">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="levelSearch" type="search" placeholder="搜索标题或关卡号" autocomplete="off">
    </label>
    <div id="levelList" class="level-list"></div>
  </dialog>

  <div id="winModal" class="win-modal" hidden>
    <div class="win-backdrop" data-close-win></div>
    <section class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <p class="eyebrow" id="winEyebrow">Level Complete</p>
      <h2 id="winTitle">完成！</h2>
      <p id="winText">这一关的全部格子已经解开。</p>
      <div class="win-actions">
        <button class="primary-button" id="winNextButton" type="button">下一关</button>
        <button class="ghost-button" id="winAgainButton" type="button">再玩一次</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
